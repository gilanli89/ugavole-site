<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Filo Jet rotası ve derin su arama şeması</title>
  <desc id="desc">Girne ile Taşucu arasındaki rota, olayın Girne'nin yaklaşık 4 ila 5 deniz mili kuzeyindeki alanı ve 550 metre derinlikte ulaşılan gemi gösteriliyor.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113c5e"/>
      <stop offset="1" stop-color="#061625"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0L7 3 0 6z" fill="#f5c518"/>
    </marker>
  </defs>
  <rect width="1200" height="780" rx="32" fill="#f4f0e7"/>
  <text x="64" y="64" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2">ROTA + DERİN SU ARAMASI</text>
  <text x="64" y="116" fill="#102235" font-family="Georgia, serif" font-size="48" font-weight="700">Facianın coğrafyası</text>
  <text x="1136" y="64" fill="#596875" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">Şematik anlatım • ölçekli değildir</text>

  <g transform="translate(64 150)">
    <rect width="1072" height="244" rx="24" fill="#dbe8ec"/>
    <path d="M0 36C160 56 235 17 366 30c125 13 195 54 342 26 114-22 221-9 364 13V0H0z" fill="#d8c29d"/>
    <path d="M0 227c152-17 211 11 348-2 123-12 242-48 376-20 119 25 227 25 348-2v41H0z" fill="#d8c29d"/>
    <text x="54" y="52" fill="#233342" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TAŞUCU</text>
    <circle cx="88" cy="70" r="7" fill="#102235"/>
    <text x="916" y="218" fill="#233342" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GİRNE</text>
    <circle cx="990" cy="195" r="7" fill="#102235"/>
    <path d="M978 185C849 140 739 87 605 93c-134 5-230 72-368 28C181 103 133 87 101 75" fill="none" stroke="#f5c518" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 11" marker-end="url(#arrow)"/>
    <circle cx="907" cy="161" r="38" fill="#cf6a39" fill-opacity=".15" stroke="#b54d20" stroke-width="3" stroke-dasharray="7 7"/>
    <circle cx="907" cy="161" r="8" fill="#b54d20"/>
    <rect x="548" y="132" width="320" height="74" rx="15" fill="#ffffff" fill-opacity=".94"/>
    <text x="570" y="160" fill="#102235" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Olay alanı</text>
    <text x="570" y="186" fill="#4b5f6d" font-family="Arial, Helvetica, sans-serif" font-size="16">Girne'nin yaklaşık 4–5 deniz mili kuzeyi</text>
    <text x="54" y="218" fill="#60727f" font-family="Arial, Helvetica, sans-serif" font-size="15">Girne–Taşucu düz hat mesafesi yaklaşık 120 km / 65 deniz mili</text>
  </g>

  <g transform="translate(64 424)">
    <rect width="1072" height="286" rx="24" fill="url(#sea)"/>
    <path d="M0 49c130 18 206-19 339 0s207-17 343 0 226-16 390 0" fill="none" stroke="#5ca0bd" stroke-width="4" opacity=".7"/>
    <text x="28" y="35" fill="#dbeaf1" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">DENİZ YÜZEYİ</text>
    <g transform="translate(786 8)">
      <path d="M0 35h190l-21 24H25z" fill="#e6eef2"/>
      <rect x="63" y="7" width="78" height="29" rx="5" fill="#e6eef2"/>
      <path d="M99 8V0M116 8V0" stroke="#e6eef2" stroke-width="4"/>
      <text x="95" y="79" fill="#c3d8e3" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">TCG Işın + TCG Alemdar</text>
    </g>
    <path d="M879 62c-8 44-43 69-29 111 11 33-6 51-21 71" fill="none" stroke="#f5c518" stroke-width="3"/>
    <g transform="translate(799 226)">
      <rect width="58" height="28" rx="10" fill="#f5c518"/>
      <circle cx="10" cy="14" r="5" fill="#203b50"/>
      <circle cx="48" cy="14" r="5" fill="#203b50"/>
      <path d="M58 14h42" stroke="#f5c518" stroke-width="3"/>
      <path d="M100 6l14 8-14 8z" fill="#f5c518"/>
    </g>
    <line x1="82" y1="63" x2="82" y2="246" stroke="#8ca9b9" stroke-width="2" stroke-dasharray="6 7"/>
    <line x1="70" y1="63" x2="94" y2="63" stroke="#8ca9b9" stroke-width="2"/>
    <line x1="70" y1="246" x2="94" y2="246" stroke="#8ca9b9" stroke-width="2"/>
    <text x="107" y="160" fill="#ffffff" font-family="Georgia, serif" font-size="37" font-weight="700">≈550 m</text>
    <text x="107" y="190" fill="#adc3d0" font-family="Arial, Helvetica, sans-serif" font-size="16">ulaşılan geminin yaklaşık derinliği</text>
    <g transform="translate(360 178)">
      <ellipse cx="172" cy="58" rx="135" ry="23" fill="#010b13" opacity=".8"/>
      <rect width="350" height="90" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="20" y="30" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">2 Eylül güncellemesi</text>
      <text x="20" y="54" fill="#c7d8e1" font-family="Arial, Helvetica, sans-serif" font-size="15">Gemiye ulaşıldı; 24 saatlik görüntüleme</text>
      <text x="20" y="75" fill="#c7d8e1" font-family="Arial, Helvetica, sans-serif" font-size="15">ve arama çalışmaları sürüyor.</text>
    </g>
  </g>

  <text x="64" y="748" fill="#596875" font-family="Arial, Helvetica, sans-serif" font-size="13">Kaynaklar: KKTC/TAK, Larnaka Arama Kurtarma Koordinasyon Merkezi, Ceyport Taşucu. Olay noktası yaklaşık alan olarak gösterilmiştir.</text>
  <text x="1136" y="748" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="end">ugavole</text>
</svg>
