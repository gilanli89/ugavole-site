<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Filo Jet faciasının 2 Eylül 2026 tarihli bilançosu</title>
  <desc id="desc">Gemideki 267 kişiden 239 kişiye sağ ulaşıldı, 9 kişi hayatını kaybetti ve 19 kişi aranıyor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#102d48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1110" cy="92" r="170" fill="#1d4666" opacity=".34"/>
  <circle cx="1070" cy="630" r="220" fill="#0f7590" opacity=".12"/>

  <text x="72" y="67" fill="#f5c518" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4">FİLO JET • GİRNE AÇIKLARI</text>
  <text x="72" y="125" fill="#ffffff" font-family="Georgia, serif" font-size="52" font-weight="700">Bir bakışta bilanço</text>
  <text x="72" y="158" fill="#aebfcb" font-family="Arial, Helvetica, sans-serif" font-size="18">2 Eylül 2026, 19.10 itibarıyla</text>

  <g transform="translate(72 205)">
    <rect width="1056" height="126" rx="24" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="34" y="80" fill="#ffffff" font-family="Georgia, serif" font-size="72" font-weight="700">267</text>
    <text x="190" y="55" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">gemideki toplam kişi</text>
    <text x="190" y="88" fill="#aebfcb" font-family="Arial, Helvetica, sans-serif" font-size="19">259 yolcu + 8 mürettebat</text>
    <g transform="translate(765 34)">
      <path d="M0 38h214" stroke="#6b8aa0" stroke-width="2" stroke-dasharray="7 8"/>
      <path d="M18 37l16-13h99l28 13h30l13 13H5z" fill="#d9e6ee"/>
      <rect x="77" y="8" width="63" height="17" rx="5" fill="#d9e6ee"/>
      <path d="M105 8V0M119 8V0" stroke="#d9e6ee" stroke-width="4"/>
      <path d="M0 57c30 10 58-10 88 0s58-10 88 0 34 1 47-2" fill="none" stroke="#2ca4b8" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(72 366)">
      <rect width="328" height="172" rx="24" fill="#0f726f"/>
      <text x="28" y="78" fill="#ffffff" font-family="Georgia, serif" font-size="62" font-weight="700">239</text>
      <text x="28" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">kişiye sağ ulaşıldı</text>
      <text x="28" y="144" fill="#bfe9e5" font-family="Arial, Helvetica, sans-serif" font-size="15">Resmî son sayım</text>
    </g>
    <g transform="translate(436 366)">
      <rect width="328" height="172" rx="24" fill="#8d3f49"/>
      <text x="28" y="78" fill="#ffffff" font-family="Georgia, serif" font-size="62" font-weight="700">9</text>
      <text x="28" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">kişi hayatını kaybetti</text>
      <text x="28" y="144" fill="#f3cfd3" font-family="Arial, Helvetica, sans-serif" font-size="15">Ailelere başsağlığı diliyoruz</text>
    </g>
    <g transform="translate(800 366)">
      <rect width="328" height="172" rx="24" fill="#9b6812"/>
      <text x="28" y="78" fill="#ffffff" font-family="Georgia, serif" font-size="62" font-weight="700">19</text>
      <text x="28" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">kişi aranıyor</text>
      <text x="28" y="144" fill="#fde4a6" font-family="Arial, Helvetica, sans-serif" font-size="15">Arama-kurtarma 4. gününde</text>
    </g>
  </g>

  <g transform="translate(72 574)">
    <rect width="1056" height="16" rx="8" fill="#24445a"/>
    <path d="M8 0h938a8 8 0 0 1 8 8 8 8 0 0 1-8 8H8A8 8 0 0 1 0 8 8 8 0 0 1 8 0z" fill="#20a39e"/>
    <rect x="946" width="32" height="16" fill="#c45d68"/>
    <path d="M978 0h70a8 8 0 0 1 8 8 8 8 0 0 1-8 8h-70z" fill="#d18f1c"/>
  </g>
  <text x="72" y="625" fill="#90a7b7" font-family="Arial, Helvetica, sans-serif" font-size="14">Kaynak: KKTC Başbakanlığı ve TAK/Radyo Güven. Sayılar yeni teyitlerle değişebilir.</text>
  <text x="1128" y="625" fill="#f5c518" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="end">ugavole</text>
</svg>
