<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Filo Jet faciasının ilk dört gününün zaman çizelgesi</title>
  <desc id="desc">30 Ağustos'taki kalkış ve tehlike sinyalinden 2 Eylül'de devam eden arama çalışmalarına kadar doğrulanmış başlıca gelişmeler.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3e9"/>
      <stop offset="1" stop-color="#e7eef0"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#152738" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="64" y="64" fill="#a07000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2">DOĞRULANMIŞ GELİŞMELER</text>
  <text x="64" y="116" fill="#102235" font-family="Georgia, serif" font-size="48" font-weight="700">Dört günde ne oldu?</text>
  <text x="64" y="147" fill="#5b6b77" font-family="Arial, Helvetica, sans-serif" font-size="17">30 Ağustos–2 Eylül 2026</text>

  <path d="M112 231H1088" stroke="#b8c7cd" stroke-width="5" stroke-linecap="round"/>
  <g fill="#102235" stroke="#f5c518" stroke-width="6">
    <circle cx="150" cy="231" r="14"/>
    <circle cx="380" cy="231" r="14"/>
    <circle cx="610" cy="231" r="14"/>
    <circle cx="840" cy="231" r="14"/>
    <circle cx="1050" cy="231" r="14"/>
  </g>

  <g filter="url(#card)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 269)">
      <rect width="190" height="272" rx="20" fill="#ffffff"/>
      <text x="20" y="37" fill="#a07000" font-size="15" font-weight="700">30 AĞUSTOS</text>
      <text x="20" y="73" fill="#102235" font-size="20" font-weight="700">Öğle saatleri</text>
      <text x="20" y="108" fill="#4f626f" font-size="15">Filo Jet, 259 yolcu</text>
      <text x="20" y="131" fill="#4f626f" font-size="15">ve 8 mürettebatla</text>
      <text x="20" y="154" fill="#4f626f" font-size="15">Girne'den Taşucu'na</text>
      <text x="20" y="177" fill="#4f626f" font-size="15">doğru yola çıktı.</text>
      <text x="20" y="238" fill="#758894" font-size="13">Kesin kalkış dakikası</text>
      <text x="20" y="257" fill="#758894" font-size="13">resmî kayıtlarda netleşmeli.</text>
    </g>
    <g transform="translate(268 269)">
      <rect width="224" height="272" rx="20" fill="#ffffff"/>
      <text x="20" y="37" fill="#a07000" font-size="15" font-weight="700">30 AĞUSTOS • 12.13</text>
      <text x="20" y="73" fill="#102235" font-size="20" font-weight="700">Tehlike sinyali</text>
      <text x="20" y="108" fill="#4f626f" font-size="15">Larnaka koordinasyon</text>
      <text x="20" y="131" fill="#4f626f" font-size="15">merkezi, Girne'nin 5</text>
      <text x="20" y="154" fill="#4f626f" font-size="15">deniz mili kuzeyinden</text>
      <text x="20" y="177" fill="#4f626f" font-size="15">sinyal aldığını açıkladı.</text>
      <text x="20" y="238" fill="#758894" font-size="13">Gemi kısa süre sonra</text>
      <text x="20" y="257" fill="#758894" font-size="13">alabora oldu ve battı.</text>
    </g>
    <g transform="translate(506 269)">
      <rect width="210" height="272" rx="20" fill="#ffffff"/>
      <text x="20" y="37" fill="#a07000" font-size="15" font-weight="700">31 AĞUSTOS</text>
      <text x="20" y="73" fill="#102235" font-size="20" font-weight="700">Sayım + adli süreç</text>
      <text x="20" y="108" fill="#4f626f" font-size="15">Manifesto teyidiyle</text>
      <text x="20" y="131" fill="#4f626f" font-size="15">239 sağ, 8 yaşamını</text>
      <text x="20" y="154" fill="#4f626f" font-size="15">yitiren, 20 kayıp</text>
      <text x="20" y="177" fill="#4f626f" font-size="15">olarak düzeltildi.</text>
      <text x="20" y="217" fill="#758894" font-size="13">9 zanlıya 3 gün tutukluluk;</text>
      <text x="20" y="238" fill="#758894" font-size="13">5 kişi için tahkikat.</text>
      <text x="20" y="257" fill="#758894" font-size="13">Bu karar mahkûmiyet değildir.</text>
    </g>
    <g transform="translate(730 269)">
      <rect width="218" height="272" rx="20" fill="#ffffff"/>
      <text x="20" y="37" fill="#a07000" font-size="15" font-weight="700">1 EYLÜL</text>
      <text x="20" y="73" fill="#102235" font-size="20" font-weight="700">Derin su araması</text>
      <text x="20" y="108" fill="#4f626f" font-size="15">TCG Işın sonar ve</text>
      <text x="20" y="131" fill="#4f626f" font-size="15">ROV çalışmalarına</text>
      <text x="20" y="154" fill="#4f626f" font-size="15">başladı; yaklaşık</text>
      <text x="20" y="177" fill="#4f626f" font-size="15">550 m'de cisim görüldü.</text>
      <text x="20" y="238" fill="#758894" font-size="13">Cismin Filo Jet olduğu</text>
      <text x="20" y="257" fill="#758894" font-size="13">henüz doğrulanmadı.</text>
    </g>
    <g transform="translate(962 269)">
      <rect width="174" height="272" rx="20" fill="#102235"/>
      <text x="20" y="37" fill="#f5c518" font-size="15" font-weight="700">2 EYLÜL</text>
      <text x="20" y="73" fill="#ffffff" font-size="20" font-weight="700">Dördüncü gün</text>
      <text x="20" y="108" fill="#c8d7df" font-size="15">Gemiye ulaşıldı.</text>
      <text x="20" y="131" fill="#c8d7df" font-size="15">Bir naaş çıkarıldı;</text>
      <text x="20" y="154" fill="#c8d7df" font-size="15">9 can kaybı,</text>
      <text x="20" y="177" fill="#c8d7df" font-size="15">19 kayıp.</text>
      <text x="20" y="238" fill="#9fb3bf" font-size="13">Son durum:</text>
      <text x="20" y="257" fill="#ffffff" font-size="13" font-weight="700">19.10</text>
    </g>
  </g>

  <g transform="translate(64 581)">
    <rect width="1072" height="108" rx="22" fill="#f5c518"/>
    <text x="28" y="43" fill="#102235" font-family="Georgia, serif" font-size="27" font-weight="700">Kesin neden henüz açıklanmadı.</text>
    <text x="28" y="75" fill="#384957" font-family="Arial, Helvetica, sans-serif" font-size="16">Teknik kayıtlar, bakım ve klas belgeleri, deniz koşulları, insan faktörü ve batık üzerindeki bulgular birlikte inceleniyor.</text>
  </g>

  <text x="64" y="729" fill="#657682" font-family="Arial, Helvetica, sans-serif" font-size="13">Kaynaklar: KKTC Başbakanlığı, TAK/Radyo Güven, Larnaka Arama Kurtarma Koordinasyon Merkezi.</text>
  <text x="1136" y="729" fill="#a07000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="end">ugavole</text>
</svg>
